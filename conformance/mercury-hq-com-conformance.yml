description: >-
  Cross-cutting and domain standards MERCURY's public surface conforms to, each with the document or
  response that decided it. The domain-standard signatures here are read from the contract and the wire:
  the OpenAPI declares x402 payment terms per operation (x-payment-info / x-x402 with CAIP-2 network ids
  and an ERC-20 asset address) and the live 402 carries an x402 v1 accepts[] body; the agent card and the
  ERC-8004 registration file carry an on-chain agent identity. No compliance programme or certification
  (SOC 2, ISO 27001, PCI DSS, HIPAA) is published on /trust or anywhere else - the trust page is an
  operator-identity and verify-it-yourself page - so no Compliance pointer is emitted.
standards:
- id: x402
  conforms: true
  version: challenge x402Version 1; discovery document x402Version 2
  evidence: >-
    DOMAIN STANDARD SIGNATURE. Contract: every paid operation in the OpenAPI carries x-payment-info
    {protocols: [x402], scheme: exact, price, currency USDC, network base, networkCaip2 eip155:8453, asset
    0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913, payTo, facilitator https://api.cdp.coinbase.com/platform/v2/x402,
    x402Version 1} and an x-x402 block with accepts[] tiers; the document-level x-payment-info repeats it.
    Wire: unpaid GET /buy/fetch answered HTTP 402 application/json {x402Version: 1, error: "X-PAYMENT header
    is required", accepts: [{scheme: exact, network: base, maxAmountRequired: "3000", resource, payTo,
    maxTimeoutSeconds: 60, asset, outputSchema{input,output}, extra{name: USD Coin, version: 2}}]}.
    Discovery: /.well-known/x402 (and /x402/discovery) is an x402Version 2 service document with 18
    resources, seller, payTo, facilitator and bazaarIndexing; the card's securitySchemes.x402 and the
    ERC-8004 file's x402 endpoint point at the same /buy/fetch resource. The 402 body is x402 v1 shape
    (X-PAYMENT header, maxAmountRequired) while the discovery doc declares v2 - recorded as a version skew.
- id: a2a
