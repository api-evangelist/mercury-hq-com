  update:
    x-payment-challenge-observed:
      fetched: '2026-09-19'
      request: GET https://network.mercury-hq.com/buy/fetch?url=https://example.com (unpaid)
      status: 402
      body_shape: '{x402Version: 1, error: "X-PAYMENT header is required", accepts: [{scheme: exact, network: base, maxAmountRequired: "3000", resource, payTo, maxTimeoutSeconds: 60, asset, outputSchema{input, output}, extra{name: USD Coin, version: 2}}]}'
      note: The spec's 402 responses declare a description only ("Terms are in the challenge body (x402 v1)"); no schema, no headers. The live body is x402 v1 while /.well-known/x402 declares x402Version 2.
- target: $.info
  update:
    x-spec-gaps:
    - no components.securitySchemes although two credentials exist (X-PAYMENT x402 header; Authorization Bearer mk_ API key) - see authentication/mercury-hq-com-authentication.yml
    - no examples anywhere; a free real sample response exists at https://network.mercury-hq.com/x402/attestation/sample
    - no 4xx other than 402 declared; observed 404 {ok,error,status,discovery,hint}, 503 mint-disabled (Retry-After 3600) on gated SKUs, 401 on /api/dev/*
    - 11 of 18 paid operations omit the attestation object from their 200 schema although the docs state every paid result ships one
    - the key-management routes POST /api/dev/keys, GET /api/dev/balance, POST /api/dev/topup are not in the spec
    - no tags object at the document level; operation tags are free-form marketing tags (up to 17 per operation)
- target: $.components
  update:
