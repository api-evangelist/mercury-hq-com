apis:
- name: MERCURY Web Fetch A2A Agent
  description: >-
    Agent-to-Agent (A2A 0.3.0) surface for "MERCURY Web Fetch", published as a conformant agent card at
    https://network.mercury-hq.com/.well-known/agent-card.json (and the legacy /.well-known/agent.json,
    byte-identical) with one skill (web-fetch), JSONRPC preferred transport, an x402 security scheme (pay
    per call, $0.003 USDC on Base) and an ERC-8004 registration (agentId 54791 on eip155:8453). The JSON-RPC
    endpoint https://network.mercury-hq.com/a2a implements message/send only (tasks/get answers -32601
    "Mercury implements message/send"); an unpaid message/send returns a free preview with the page title
    and status and points at the paid /buy/fetch route. GET on /a2a 307-redirects to the card.
  image: https://network.mercury-hq.com/favicon.svg
  humanURL: https://network.mercury-hq.com/university/docs/web-fetch
  baseURL: https://network.mercury-hq.com/a2a
  tags:
  - A2A
  - Agents
  - JSON-RPC
  - x402
  - Web Scraping
  properties:
  - type: AgentCard
    url: a2a/mercury-hq-com-a2a.yml
  - type: Documentation
    url: https://network.mercury-hq.com/university/docs/web-fetch
  - type: Authentication
    url: authentication/mercury-hq-com-authentication.yml
  - type: Conformance
    url: conformance/mercury-hq-com-conformance.yml
- name: MERCURY MCP Server
  description: >-
    Hosted Model Context Protocol server (serverInfo mercury-x402 1.0.0, protocolVersion 2025-06-18, streamable
    HTTP, JSON-RPC 2.0 over POST https://network.mercury-hq.com/mcp) exposing 18 tools that mirror the
    18 paid /buy/* routes one-to-one, each with a real inputSchema. tools/list and initialize are free
    and unauthenticated; tools/call requires a Mercury API key (Authorization: Bearer mk_...). A first-party
    stdio package, mercury-x402-mcp on npm (npx -y mercury-x402-mcp, wallet key in MERCURY_PRIVATE_KEY),
    wraps the same catalog for wallet-paying agents and adds free mercury_catalog and mercury_verify tools.
  image: https://network.mercury-hq.com/favicon.svg
  humanURL: https://network.mercury-hq.com/university/developers
  baseURL: https://network.mercury-hq.com/mcp
