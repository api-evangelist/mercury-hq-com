description: >-
  MERCURY has no separate sandbox host or test network for the API itself (the paid routes are live on
  Base mainnet with real USDC); what it publishes instead is a free rail and a set of $0 rehearsal
  surfaces. The API-key rail issues a free mk_test_ key with 100 credits that runs the SAME /buy/* routes
  with the same signed receipts; the x402 rail can be rehearsed unpaid because every paid route returns
  its full 402 terms without charging; /buy/signal is a $0 SKU that exercises the whole buy loop on
  labelled sample data; and the provenance receipt can be studied on a free real sample and checked with a
  free verifier. Values below are copied from the docs; nothing is invented. The in-game mint SKUs "stay
  on testnet on purpose" and answer 503 before any charge.
test_vs_live:
  api_key_rail:
    test_prefix: mk_test_
    live_prefix: mk_live_
    issue_test_key: 'POST https://network.mercury-hq.com/api/dev/keys?live=false&label=<optional> -> 201 {ok, key, keyId, env, tail, usage, save_it}'
    test_quota: 100 credits (1 credit = $0.001; a $0.005 SKU costs 5 credits)
    test_rate_limit: 5 requests per minute
    issuance_cap: 20 keys per IP per hour
    key_storage: raw key shown once; only sha256 + a 4-char tail stored
    usage: 'curl -H "Authorization: Bearer mk_test_YOUR_KEY" "https://network.mercury-hq.com/buy/fetch?url=https://example.com"'
    balance: GET /api/dev/balance (Bearer key)
    go_live: subscribe a tier at /pricing (Stripe Checkout) or POST /api/dev/topup?key=mk_live_...&usd=10
  x402_rail:
    network: Base mainnet (eip155:8453) only; testnet false in every discovery document
    dry_run: 'any paid route called without X-PAYMENT returns 402 with the exact price, payTo, asset and outputSchema and charges nothing (observed on /buy/fetch)'
    note: 'the landing page''s 5-line example comments "throwaway Base-Sepolia key w/ USDC" but the storefront settles on mainnet; there is no published Sepolia endpoint'
