      mcp_tool: fetch
      a2a_skill: web-fetch (agent card; message/send free preview)
      x402_tiers: [fetch $0.003, plus $0.006, pro $0.012]
      idempotency: none - every settled attempt is charged and non-refundable
- target: $.paths['/buy/signal'].get
  update:
    x-apievangelist-notes:
