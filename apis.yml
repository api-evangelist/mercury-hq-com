- name: MERCURY Web Fetch A2A Agent
  description: >-
    Agent-to-Agent (A2A 0.3.0) surface for "MERCURY Web Fetch", published as a conformant agent card at
    https://network.mercury-hq.com/.well-known/agent-card.json (and the legacy /.well-known/agent.json,
    byte-identical) with one skill (web-fetch), JSONRPC preferred transport, an x402 security scheme
    (pay per call, $0.003 USDC on Base) and an ERC-8004 registration (agentId 54791 on eip155:8453). The
    JSON-RPC endpoint https://network.mercury-hq.com/a2a implements message/send only (tasks/get answers
    -32601 "Mercury implements message/send"); an unpaid message/send returns a free preview with the
    page title and status and points at the paid /buy/fetch route. GET on /a2a 307-redirects to the card.
  image: https://network.mercury-hq.com/favicon.svg
  humanURL: https://network.mercury-hq.com/university/docs/web-fetch
  baseURL: https://network.mercury-hq.com/a2a
