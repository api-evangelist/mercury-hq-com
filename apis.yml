- name: MERCURY MCP Server
  description: >-
    Hosted Model Context Protocol server (serverInfo mercury-x402 1.0.0, protocolVersion 2025-06-18,
    streamable HTTP, JSON-RPC 2.0 over POST https://network.mercury-hq.com/mcp) exposing 18 tools that
    mirror the 18 paid /buy/* routes one-to-one, each with a real inputSchema. tools/list and initialize
    are free and unauthenticated; tools/call requires a Mercury API key (Authorization: Bearer mk_...).
    A first-party stdio package, mercury-x402-mcp on npm (npx -y mercury-x402-mcp, wallet key in
    MERCURY_PRIVATE_KEY), wraps the same catalog for wallet-paying agents and adds free mercury_catalog
    and mercury_verify tools.
  image: https://network.mercury-hq.com/favicon.svg
  humanURL: https://network.mercury-hq.com/university/developers
  baseURL: https://network.mercury-hq.com/mcp
