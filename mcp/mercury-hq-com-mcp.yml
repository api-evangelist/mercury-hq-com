  version: 1.0.0
  transport: http
  url: https://network.mercury-hq.com/mcp
  protocol_version: '2025-06-18'
  capabilities: {tools: {}}
  instructions: 'Mercury - agent-payable web data. tools/list is free; tools/call needs a Mercury API key (Authorization: Bearer mk_…, free at https://mercury-x402-jed.fly.dev/developers). Every result carries a signed EIP-191 provenance receipt.'
  origin_alias: https://mercury-x402-jed.fly.dev (the Fly.io app behind network.mercury-hq.com; the initialize instructions and the npm README point at it)
