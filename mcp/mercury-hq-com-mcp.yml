description: >-
  MERCURY ships a real, hosted Model Context Protocol server AND a first-party stdio package. The hosted
  server at https://network.mercury-hq.com/mcp answers GET with a descriptor ({name: mercury-x402,
  transport: streamable-http, endpoint: "POST /mcp (JSON-RPC 2.0)", tools: 18}), completes initialize
  (protocolVersion 2025-06-18, capabilities {tools: {}}, instructions "tools/list is free; tools/call needs a
  Mercury API key (Authorization: Bearer mk_...)") and returns 18 tools from tools/list without
  credentials, each with a JSON Schema inputSchema that matches the query parameters of the backing
  /buy/* operation in the OpenAPI. tools/call is gated by a Mercury API key; a free mk_test_ key is issued
  at /developers (POST /api/dev/keys?live=false). The npm package mercury-x402-mcp (bin mercury-x402-mcp,
  deps @modelcontextprotocol/sdk, viem, x402-fetch) runs the same catalog locally over stdio and pays per
  call from the operator's own Base wallet (env MERCURY_PRIVATE_KEY) instead of an API key; its README says
  the tool list is "built live from Mercury's catalog" and adds free mercury_catalog and mercury_verify tools.
deployment:
  mode: both
  endpoint: https://network.mercury-hq.com/mcp
  install: npx -y mercury-x402-mcp
  package: https://www.npmjs.com/package/mercury-x402-mcp
  auth: api-key
  auth_detail: >-
    Remote endpoint - tools/list and initialize anonymous; tools/call requires Authorization: Bearer
    mk_test_... or mk_live_... (free sandbox key, 100 credits, from /developers). Stdio package - no API
    key; a funded Base-mainnet wallet private key in MERCURY_PRIVATE_KEY pays each call over x402.
  verified: probed
  checked: '2026-09-19'
  probes:
  - {url: 'https://network.mercury-hq.com/mcp', method: GET, status: 200, body: '{"name":"mercury-x402","transport":"streamable-http","endpoint":"POST /mcp (JSON-RPC 2.0)","tools":18,"note":"tools/list is free; tools/call needs a Mercury API key (Authorization: Bearer mk_…). Free key: /developers"}'}
  - {url: 'https://network.mercury-hq.com/mcp', method: 'POST initialize', status: 200, result: 'protocolVersion 2025-06-18, serverInfo {name: mercury-x402, version: 1.0.0}, capabilities {tools: {}}'}
  - {url: 'https://network.mercury-hq.com/mcp', method: 'POST tools/list', status: 200, result: '18 tools, content-length 17773, application/json (no SSE framing)'}
  - {url: 'https://network.mercury-hq.com/mcp', method: 'POST tools/call web_fetch (no key)', status: 200, result: 'isError true: Unknown tool "web_fetch". Call tools/list for the catalog. (tool names are bare: fetch, extract, ...)'}
