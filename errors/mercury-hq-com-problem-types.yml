description: >-
  Error semantics of the MERCURY storefront. The OpenAPI declares only two statuses per paid route - 200
  (delivered after settlement) and 402 (payment required) - and folds upstream failures INTO the 200: a
  fetch whose target is down still returns HTTP 200 with ok:false and an error string, and is still
  charged ("pay per ATTEMPT"). Everything else was learned from the wire. There is no human error
  reference page; there is no application/problem+json; every error body is JSON with an ok:false or
  error field and, on 404, a discovery block pointing an agent back at the catalog.
format: proprietary-json
envelope:
  success: '{ok: true, url, status, ...service fields..., attestation{keyId, alg, address, contentHash, nonce, signedAt, signature, verify{message, howTo}}}'
  honest_failure_200: '{ok: false, url, status (upstream), error} - HTTP 200, charged'
  http_error: '{ok: false, error, status?, reason?, discovery?, hint?}'
  payment_required_402: '{x402Version: 1, error: "X-PAYMENT header is required", accepts: [{scheme, network, maxAmountRequired, resource, description, mimeType, payTo, maxTimeoutSeconds, asset, outputSchema{input, output}, extra{name, version}}]}'
  json_rpc: '{jsonrpc: "2.0", id, error: {code, message}}'
  mcp_tool_error: '{jsonrpc: "2.0", id, result: {content: [{type: text, text}], isError: true}}'
problem_types:
- status: 402
  code: payment_required
  title: Payment required (x402 challenge)
  detail: >-
    The designed first response of every paid /buy/* route when no X-PAYMENT header is present. Body is
    x402 v1: x402Version 1, error "X-PAYMENT header is required", accepts[] with the exact price in base
    units (maxAmountRequired "3000" = $0.003 USDC), network base, asset 0x8335...2913, payTo, resource,
    maxTimeoutSeconds 60 and an outputSchema echoing the operation's input and output JSON Schema. No
    WWW-Authenticate header; no Retry-After.
  remediation: "Sign an x402 payment for maxAmountRequired with an x402 client (x402-fetch / x402-axios) and replay the identical request with the X-PAYMENT header, or send Authorization: Bearer mk_... (API-key rail) instead."
  source_operation: openapi/mercury-hq-com-x402-storefront-openapi.yml#buy_web_fetch (declared on all 18 paid operations)
  observed: {url: 'https://network.mercury-hq.com/buy/fetch?url=https://example.com', status: 402, content_type: 'application/json; charset=utf-8', fetched: '2026-09-19'}
- status: 200
  code: ok_false
  title: Honest failure (delivered attempt)
  detail: >-
    The OpenAPI 200 schema declares ok (boolean, "false on an honest failure (still delivered)") and error
    ("present only when ok:false"); the terms define this as a delivered, charged attempt (e.g. target down,
    unreachable, SSRF-blocked, timeout after 5s, body over 10MB is truncated with truncated:true).
  remediation: Inspect ok before using text/data; do not retry blindly - every retry that settles is a new charge.
  source_operation: openapi/mercury-hq-com-x402-storefront-openapi.yml#buy_web_fetch
- status: 503
  code: mint-disabled
  title: Item cannot be delivered - payment refused
  detail: >-
    Returned by the gated in-game mint SKUs (/buy/matter, /buy/agent, ...) that llms.txt lists but
    /catalog omits: {ok:false, error:"on-chain delivery is OFF, so this item cannot be delivered - refusing
    payment. We never charge without delivering.", reason:"mint-disabled", deliverable:false} with
    Retry-After 3600. The docs state "Failures 503 before charging - you are never billed for a stub".
  remediation: Treat as unavailable; nothing was charged. Retry-After is 3600 seconds.
  observed: {url: 'https://network.mercury-hq.com/buy/matter', status: 503, retry_after: 3600, fetched: '2026-09-19'}
