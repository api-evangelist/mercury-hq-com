description: >-
  One first-party package exists: mercury-x402-mcp on npm, a stdio MCP server that wraps the MERCURY
  catalog and pays per call over x402 from the operator's wallet. It is judged first-party because its
  README's discovery links point at https://mercury-x402-jed.fly.dev - the Fly.io origin that serves the
  byte-equivalent OpenAPI, llms.txt and catalog behind network.mercury-hq.com (confirmed 2026-09-19; the
  hosted MCP server's own initialize instructions name the same fly.dev host) - and its publisher
  "mercurynetwork" matches the app name. It is an MCP server, not a client SDK: the provider publishes no
  language SDK and its docs say "no Mercury SDK" is needed (verification is plain EIP-191 ecrecover; calls
  are plain HTTP with x402-fetch/x402-axios or a Bearer key). No SDKs pointer is emitted. Searched and
  absent: npm (mercury-hq, mercury-storefront), PyPI (mercury-x402, mercury-hq both 404), GitHub orgs
  mercury-hq / mercuryhq / mercury-x402 (404), Maven Central, NuGet, RubyGems, Packagist, crates.io,
  pkg.go.dev (no MERCURY artifacts by name). Third-party client libraries the docs recommend - x402-fetch,
  x402-axios, viem, @coinbase/cdp-sdk - belong to Coinbase / the x402 Foundation and are not listed here.
