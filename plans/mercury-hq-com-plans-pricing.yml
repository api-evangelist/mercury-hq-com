note: 'MERCURY publishes two price surfaces for the same 18 paid routes. (1) The x402 rail: a fixed per-call USDC
  price per SKU, machine-readable in /catalog, /.well-known/x402 and the OpenAPI, and carried in the live 402 challenge
  (the provider states all four are generated from one catalog object so they cannot drift; the challenge for /buy/fetch
  carried maxAmountRequired 3000 base units = $0.003, matching). /buy/fetch additionally declares three x402 tiers
  in its x-x402.accepts (fetch $0.003, plus $0.006 with markdown + link graph, pro $0.012 with structured extract).
  (2) The API-key rail: four monthly tiers on /pricing billed through Stripe Checkout, metered in credits at 1 credit
  = $0.001 (a $0.005 SKU costs 5 credits), plus one-time credit top-ups ($1 = 1,000 credits, $5-$500). The provider
  is candid that it has N=0 external buyers and 0 paying subscribers; the /university hub still labels the API-key
  paid tier "Building" while /developers and /pricing describe it as live with Stripe - recorded as stated. All
  payments are NON-REFUNDABLE once settled and there is no SLA (terms, effective 2026-06-04). The nine in-game mint
  SKUs (matter, antimatter, dark-matter, brick, agent, shelf, wand, api-render, api-oracle) that llms.txt lists
  at $0.01-$1.00 are NOT in /catalog or the OpenAPI and answer 503 mint-disabled with Retry-After 3600 before any
  charge; they are listed below as unavailable, not as plans.'
