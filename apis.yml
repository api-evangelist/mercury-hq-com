apis:
- name: MERCURY x402 Storefront API
  description: >-
    REST/JSON API (OpenAPI 3.1.0, info.title "MERCURY x402 storefront", x-spec mercury-storefront/1) of 19
    GET routes under /buy/*, one per Cited web-data service, each declaring its price in x-payment-info /
    x-x402 and answering an unpaid call with an HTTP 402 x402 challenge (accepts[] with scheme exact,
    network base, USDC asset 0x8335...2913, payTo and maxTimeoutSeconds 60). Paid results carry an
    attestation object (EIP-191 signature over sha256(text), url, status, fetchedAt, nonce) verifiable
    offline against /.well-known/mercury-attestation. /buy/signal is a free $0 demo read. The same routes
    accept Authorization: Bearer mk_test_/mk_live_ API keys issued at /developers. The spec declares no
    securitySchemes, no components and no examples; every operation has an operationId, summary,
    description, tags and 200/402 responses.
  image: https://network.mercury-hq.com/favicon.svg
  humanURL: https://network.mercury-hq.com/university/docs
