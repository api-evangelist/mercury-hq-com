      x402Payment:
        type: apiKey
        in: header
        name: X-PAYMENT
        description: 'API Evangelist annotation (not declared by the provider): x402 v1 signed payment payload; obtain terms from the 402 challenge; scheme exact, USDC on Base mainnet (eip155:8453).'
      mercuryApiKey:
        type: http
        scheme: bearer
        description: 'API Evangelist annotation (not declared by the provider): Mercury API key mk_test_ (free sandbox, 100 credits) or mk_live_ (Stripe-billed), from https://network.mercury-hq.com/developers.'
- target: $.paths['/buy/fetch'].get
