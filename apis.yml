aid: mercury-hq-com
name: MERCURY
description: >-
  MERCURY (Mercury Holdings Pty Ltd, Queensland, Australia) runs an agent-payable web-data network at
  network.mercury-hq.com: 19 live "Cited" services - verifiable web fetch, LLM-ready markdown, structured
  extract, metadata, link graph, robots/AI-crawler audit, diff, notarize, security-headers audit, table, feed,
  availability, JSON Schema validate, Merkle batch, sitemap, DNS snapshot, readability and redirect resolution -
  each sold per call over HTTP 402 (x402, USDC on Base mainnet eip155:8453) and each returning an
  EIP-191 signed provenance receipt verifiable offline against a pinned key. Three doors reach
  the same routes: keyless x402 micropayments, a Mercury API key (free sandbox and
  paid tiers), and a hosted MCP server whose tools/list is free. Discovery is
  machine-first: OpenAPI 3.1, llms.txt, /catalog, /.well-known/x402, a conformant A2A 0.3.0 agent card, an
  ERC-8004 registration and security.txt. The provider states it is early and has no external buyers yet.
